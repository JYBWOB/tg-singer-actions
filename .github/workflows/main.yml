name: Telegram automatic check-in

on:
  schedule:
    # GitHub cron uses UTC. 02:30 UTC is 10:30 in Asia/Shanghai.
    # Edit only this line to change the automatic run time.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tg-signer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sign-in:
    name: Run tg-signer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TG_SIGNER_VERSION: "0.9.2"
      TZ: ${{ vars.TZ || 'Asia/Shanghai' }}

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SESSION_STRING: ${{ secrets.TG_SESSION_STRING || secrets.SESSION_STRING }}
          SIGNER_CONFIG: ${{ secrets.TG_SIGNER_CONFIG }}
          LEGACY_TASK_MAP: ${{ secrets.TASK_MAP }}
        run: |
          if [[ -z "${SESSION_STRING}" ]]; then
            echo "::error::Missing TG_SESSION_STRING (or legacy SESSION_STRING) repository secret"
            exit 1
          fi
          if [[ -z "${SIGNER_CONFIG}" && -z "${LEGACY_TASK_MAP}" ]]; then
            echo "::error::Missing TG_SIGNER_CONFIG (or legacy TASK_MAP) repository secret"
            exit 1
          fi
          python3 -c 'import json, os; raw = os.environ["SIGNER_CONFIG"] or os.environ["LEGACY_TASK_MAP"]; value = json.loads(raw); assert isinstance(value, dict) and value, "configuration must be a non-empty JSON object"'

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install tg-signer
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "tg-signer[speedup]==${TG_SIGNER_VERSION}"
          tg-signer version

      - name: Import configuration
        shell: bash
        env:
          SIGNER_CONFIG: ${{ secrets.TG_SIGNER_CONFIG }}
          LEGACY_TASK_MAP: ${{ secrets.TASK_MAP }}
        run: |
          workdir="${RUNNER_TEMP}/tg-signer"
          tasks_file="${RUNNER_TEMP}/tg-signer-tasks.txt"
          mkdir -p "${workdir}"

          if [[ -n "${SIGNER_CONFIG}" ]]; then
            printf '%s' "${SIGNER_CONFIG}" \
              | tg-signer --workdir "${workdir}" import github-actions
            printf '%s\n' 'github-actions' > "${tasks_file}"
          else
            echo "Using legacy TASK_MAP; run scripts/setup.sh to migrate to TG_SIGNER_CONFIG."
            python3 -c 'import base64, json, os; task_map = json.loads(os.environ["LEGACY_TASK_MAP"]); assert isinstance(task_map, dict) and task_map, "TASK_MAP must be a non-empty JSON object"; configs = list(task_map.values()); assert all(isinstance(config, dict) for config in configs), "each TASK_MAP value must be a JSON object"; [print(f"legacy-{index:03d}\t{base64.b64encode(json.dumps(config, ensure_ascii=False, separators=(chr(44), chr(58))).encode()).decode()}") for index, config in enumerate(configs, start=1)]' \
              > "${RUNNER_TEMP}/legacy-tasks.tsv"

            : > "${tasks_file}"
            while IFS=$'\t' read -r task_name encoded_config; do
              printf '%s' "${encoded_config}" \
                | base64 --decode \
                | tg-signer --workdir "${workdir}" import "${task_name}"
              printf '%s\n' "${task_name}" >> "${tasks_file}"
            done < "${RUNNER_TEMP}/legacy-tasks.tsv"
          fi

      - name: Run check-in once
        shell: bash
        env:
          SESSION_STRING: ${{ secrets.TG_SESSION_STRING || secrets.SESSION_STRING }}
          CUSTOM_TG_PROXY: ${{ secrets.TG_PROXY }}
          CUSTOM_TG_API_ID: ${{ secrets.TG_API_ID }}
          CUSTOM_TG_API_HASH: ${{ secrets.TG_API_HASH }}
          CUSTOM_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CUSTOM_OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          CUSTOM_OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          export TG_SESSION_STRING="${SESSION_STRING}"

          if [[ -n "${CUSTOM_TG_PROXY}" ]]; then
            export TG_PROXY="${CUSTOM_TG_PROXY}"
          fi
          if [[ -n "${CUSTOM_TG_API_ID}" ]]; then
            export TG_API_ID="${CUSTOM_TG_API_ID}"
          fi
          if [[ -n "${CUSTOM_TG_API_HASH}" ]]; then
            export TG_API_HASH="${CUSTOM_TG_API_HASH}"
          fi
          if [[ -n "${CUSTOM_OPENAI_API_KEY}" ]]; then
            export OPENAI_API_KEY="${CUSTOM_OPENAI_API_KEY}"
          fi
          if [[ -n "${CUSTOM_OPENAI_BASE_URL}" ]]; then
            export OPENAI_BASE_URL="${CUSTOM_OPENAI_BASE_URL}"
          fi
          if [[ -n "${CUSTOM_OPENAI_MODEL}" ]]; then
            export OPENAI_MODEL="${CUSTOM_OPENAI_MODEL}"
          fi

          tasks_file="${RUNNER_TEMP}/tg-signer-tasks.txt"
          private_log="${RUNNER_TEMP}/tg-signer-private.log"
          umask 077
          chmod 600 "${tasks_file}"
          trap 'rm -f "${private_log}"' EXIT

          while IFS= read -r task_name; do
            [[ -n "${task_name}" ]] || continue
            if ! tg-signer \
              --log-level info \
              --session_dir "${RUNNER_TEMP}" \
              --workdir "${RUNNER_TEMP}/tg-signer" \
              --in-memory \
              run-once "${task_name}" < /dev/null >> "${private_log}" 2>&1; then
              echo "::error::tg-signer failed. Its output was suppressed because it may contain private Telegram chat information."
              exit 1
            fi
          done < "${tasks_file}"

          echo "tg-signer completed successfully. Its output was suppressed to protect private Telegram chat information."
